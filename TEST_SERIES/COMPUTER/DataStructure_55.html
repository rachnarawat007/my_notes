<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Boolean Algebra (Lec 1)</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #070707;
        --bg2: #120606;
        --card: #111111;
        --card2: #171717;
        --red: #e50914;
        --red2: #ff2b35;
        --red-dark: #8f050c;
        --text: #f5f5f5;
        --muted: #a7a7a7;
        --border: #2a2a2a;
        --green: #19c37d;
        --green-bg: #082218;
        --wrong: #ff4d5a;
        --wrong-bg: #26090c;
      }

      body {
        font-family: Arial, sans-serif;
        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(229, 9, 20, 0.2),
            transparent 38%
          ),
          linear-gradient(145deg, var(--bg), var(--bg2) 55%, #080808);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      .container {
        max-width: 800px;
        margin: auto;
        padding: 16px 12px;
      }

      .card {
        background: linear-gradient(
          145deg,
          rgba(24, 24, 24, 0.98),
          rgba(12, 12, 12, 0.98)
        );
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: 14px;
        margin-top: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      #qnum {
        display: inline-block;
        color: #fff;
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: 0 5px 15px rgba(229, 9, 20, 0.22);
      }

      .qtext {
        font-size: 17px;
        line-height: 1.55;
        font-weight: 600;
        margin: 15px 0;
        color: #fff;
      }

      .opt {
        padding: 13px 14px;
        border: 1px solid #303030;
        background: #151515;
        color: #ddd;
        border-radius: 10px;
        margin: 8px 0;
        cursor: pointer;
        transition: all 0.18s ease;
        line-height: 1.4;
      }

      .opt:hover {
        border-color: var(--red);
        background: #1d0b0c;
        transform: translateY(-1px);
      }

      .opt.selected {
        border-color: var(--red2);
        background: linear-gradient(
          90deg,
          rgba(229, 9, 20, 0.2),
          rgba(229, 9, 20, 0.07)
        );
        color: #fff;
        box-shadow: inset 3px 0 0 var(--red);
      }

      .opt.correct {
        background: var(--green-bg);
        border-color: var(--green);
        color: #dfffee;
      }

      .opt.wrong {
        background: var(--wrong-bg);
        border-color: var(--wrong);
        color: #ffe2e5;
      }

      button {
        padding: 10px 16px;
        margin: 5px 3px;
        border: 1px solid #3a3a3a;
        border-radius: 9px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.18s ease;
      }

      button:hover {
        border-color: var(--red);
        background: #26090b;
        transform: translateY(-1px);
      }

      button:last-child {
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        border-color: var(--red);
        box-shadow: 0 6px 18px rgba(229, 9, 20, 0.22);
      }

      button:last-child:hover {
        background: linear-gradient(135deg, var(--red2), var(--red));
        box-shadow: 0 8px 22px rgba(229, 9, 20, 0.32);
      }

      #result {
        display: none;
        border-color: rgba(229, 9, 20, 0.45);
        background: linear-gradient(145deg, #171010, #101010);
      }

      #result h3 {
        color: #fff;
        margin-top: 0;
        padding-bottom: 10px;
        border-bottom: 1px solid #302020;
      }

      #result p {
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 7px;
        background: #151515;
        color: #ccc;
        font-size: 14px;
        line-height: 1.45;
      }

      @media (max-width: 520px) {
        .container {
          padding: 10px 9px;
        }

        .card {
          padding: 13px;
          border-radius: 12px;
          margin-top: 10px;
        }

        .qtext {
          font-size: 16px;
        }

        .opt {
          padding: 12px;
          font-size: 14px;
        }

        button {
          padding: 10px 13px;
          margin: 4px 2px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div id="qnum"></div>
        <div id="qtext" class="qtext"></div>
        <div id="options"></div>
      </div>

      <div class="card">
        <button onclick="prev()">Prev</button>
        <button onclick="next()">Next</button>
        <button onclick="submitQuiz()">Submit</button>
      </div>

      <div id="result" class="card"></div>
    </div>

    <script>
      const questions = [
        // Topic : Trees
        {
          q: "A tree is classified as which kind of data structure?",
          options: ["Linear", "Non-linear", "Primitive", "Static"],
          answer: 1,
          exp: "The source identifies a tree as a non-linear data structure.",
        },
        {
          q: "A valid tree must be free from:",
          options: ["nodes", "edges", "a root", "a closed loop"],
          answer: 3,
          exp: "The source describes a tree as having no closed loop.",
        },

        // Trees
        {
          q: "Trees organize data in which fashion?",
          options: [
            "Sequential only",
            "Random-access only",
            "Hierarchical or non-linear",
            "Circular only",
          ],
          answer: 2,
          exp: "The source states that trees organize data in a hierarchical or non-linear fashion.",
        },
        {
          q: "All elements of a tree are represented as:",
          options: ["Arrays", "Nodes", "Stacks", "Hash values"],
          answer: 1,
          exp: "The source states that all elements of a tree are represented as nodes.",
        },
        {
          q: "Why is the left graph in the source illustration not a tree?",
          options: [
            "It has no nodes",
            "It has no root",
            "It has too many leaves",
            "It contains a cycle",
          ],
          answer: 3,
          exp: "The left graph contains a closed loop, whereas a tree cannot contain one.",
        },

        // Trees Terminology
        // 1) Nodes = Contains data
        {
          q: "What does a node contain according to the source?",
          options: [
            "Only an edge",
            "Only a child",
            "Data",
            "Only a level number",
          ],
          answer: 2,
          exp: "The terminology slide states that nodes contain data.",
        },
        // 2) Root = Top Node
        {
          q: "The top node of a tree is called the:",
          options: ["leaf", "root", "sibling", "edge"],
          answer: 1,
          exp: "The source defines the root as the top node.",
        },
        // 3) Parent Node = Have Child
        {
          q: "A node that has one or more child nodes is called a:",
          options: [
            "leaf node",
            "parent node",
            "sibling node",
            "external node",
          ],
          answer: 1,
          exp: "A parent node is defined as a node that has a child.",
        },
        // 4) Child Node
        {
          q: "A node directly below a parent node is called a:",
          options: ["root node", "sibling group", "child node", "edge node"],
          answer: 2,
          exp: "A child node is directly connected below its parent.",
        },
        // 5) Siblings = Same Parent
        {
          q: "Two nodes having the same parent are called:",
          options: ["leaves", "siblings", "roots", "edges"],
          answer: 1,
          exp: "Siblings are nodes that share the same parent.",
        },
        // 6) Leaf Node/ External Node = No child
        {
          q: "A node having no child is called a:",
          options: [
            "parent node",
            "internal node",
            "root node",
            "leaf or external node",
          ],
          answer: 3,
          exp: "The source defines a leaf node, also called an external node, as having no child.",
        },
        // 7) Internal Node = Minimum 1 child
        {
          q: "An internal node has at least:",
          options: [
            "zero children",
            "one child",
            "two children",
            "three children",
          ],
          answer: 1,
          exp: "An internal node has a minimum of one child.",
        },
        // 8) Edge = Connection b/w Nodes
        {
          q: "The connection between two nodes in a tree is called an:",
          options: ["index", "array", "edge", "level"],
          answer: 2,
          exp: "An edge is the connection between nodes.",
        },
        // 9) Degree of Node = Number of child
        {
          q: "The degree of a node is the number of its:",
          options: [
            "parents",
            "children",
            "siblings",
            "edges in the whole tree",
          ],
          answer: 1,
          exp: "The source defines node degree as the number of children.",
        },
        {
          q: "What is the degree of a leaf node?",
          options: ["0", "1", "2", "It depends on the root"],
          answer: 0,
          exp: "A leaf has no child, so its degree is always 0.",
        },
        {
          q: "In the degree example shown, what is the degree of node B?",
          options: ["1", "2", "0", "3"],
          answer: 3,
          exp: "Node B has three children in the illustrated tree.",
        },
        {
          q: "In the degree example shown, what is the degree of node G?",
          options: ["0", "1", "2", "3"],
          answer: 1,
          exp: "Node G has one child, K, in the example.",
        },
        {
          q: "The degree of a tree is determined by its:",
          options: [
            "minimum number of children",
            "number of leaves",
            "number of levels",
            "maximum number of children of any node",
          ],
          answer: 3,
          exp: "The source defines degree of a tree as the maximum number of children.",
        },
        {
          q: "What is the degree of a binary tree?",
          options: ["0", "1", "3", "2"],
          answer: 3,
          exp: "The source states that the degree of a binary tree is always 2.",
        },
        // 10) Depth of Node / Level = Total number of edges from root node to a particular node (Longest path)
        {
          q: "Depth (or level) of a node is measured by the total number of edges from the:",
          options: [
            "leaf to the node",
            "root to the node",
            "node to its sibling",
            "node to every child",
          ],
          answer: 1,
          exp: "The source defines depth as the number of edges from the root to a particular node.",
        },
        {
          q: "What is the depth of the root node?",
          options: ["0", "1", "2", "Equal to the number of children"],
          answer: 0,
          exp: "The source explicitly gives root depth as 0.",
        },
        {
          q: "In the depth example, what is the depth of node E?",
          options: ["0", "1", "3", "2"],
          answer: 3,
          exp: "The source lists the depth of node E as 2.",
        },
        {
          q: "In the depth example, which nodes have depth 3?",
          options: ["B and C", "D and E", "A only", "I, J, and K"],
          answer: 3,
          exp: "The source lists I, J, and K at depth 3.",
        },
        {
          q: "What is the depth of the tree in the source example?",
          options: ["1", "2", "3", "4"],
          answer: 2,
          exp: "The source gives the depth of the tree as 3.",
        },
        // 11) Height of tree =
        {
          q: "What is the height of the tree in the illustrated height example?",
          options: ["0", "1", "2", "3"],
          answer: 3,
          exp: "The diagram labels the height of the tree as 3.",
        },
        // 11) Height of Node = longest path from the node to a leaf node
        {
          q: "The height of a node is the longest path from that node to a:",
          options: ["root node", "sibling node", "leaf node", "parent node"],
          answer: 2,
          exp: "The source defines node height as the longest path from the node to a leaf node.",
        },
        {
          q: "In the height illustration, what is the height of a leaf node?",
          options: ["0", "1", "2", "It is undefined"],
          answer: 0,
          exp: "The diagram labels leaf nodes with height 0.",
        },
        {
          q: "In the second height illustration, what is the height of node A?",
          options: ["0", "1", "2", "3"],
          answer: 2,
          exp: "The diagram marks node A with height 2.",
        },

        // Types of Tree Data Structure = 4
        {
          q: "How many main tree data-structure types are listed in the source?",
          options: ["2", "3", "4", "5"],
          answer: 2,
          exp: "The source heading states that there are four main tree data-structure types.",
        },
        {
          q: "Which of the following is listed as a main tree data-structure type?",
          options: [
            "Binary search tree",
            "Hash tree",
            "Pointer tree",
            "Linear tree",
          ],
          answer: 0,
          exp: "Binary search tree is one of the four main types listed.",
        },
        {
          q: "Which tree is identified in the source as self-balanced?",
          options: [
            "B Tree",
            "General tree",
            "Degenerate tree",
            "Complete tree",
          ],
          answer: 0,
          exp: "The source lists B Tree as a self-balanced tree.",
        },
        // 1) General Tree = Parent node can have any number of child nodes.
        {
          q: "In a general tree, a parent node can have:",
          options: [
            "only two children",
            "any number of child nodes",
            "only one child",
            "no child nodes",
          ],
          answer: 1,
          exp: "A general-tree parent can have any number of children.",
        },
        // 2) Binary Tree =
        {
          q: "A binary-tree node can have at most how many children?",
          options: ["One", "Two", "Three", "Any number"],
          answer: 1,
          exp: "A binary tree has at most two children: left and right.",
        },
        {
          q: "Which child counts are possible for a binary-tree node according to the source?",
          options: ["0, 1, or 2", "Only 0 or 2", "Only 1 or 2", "0 through 4"],
          answer: 0,
          exp: "A binary-tree node may have 0, 1, or 2 children.",
        },
        // Extended Binary Tree =
        {
          q: "In an extended binary tree, every node has:",
          options: [
            "either zero or two children",
            "at most one child",
            "exactly one child",
            "at least three children",
          ],
          answer: 0,
          exp: "The source defines an extended binary tree as having either zero or two children at every node.",
        },
        {
          q: "In an extended binary tree, a node with two children is an:",
          options: [
            "external node",
            "internal node",
            "leaf node",
            "root-only node",
          ],
          answer: 1,
          exp: "The source identifies two-child nodes as internal nodes.",
        },
        // 3) Binary Search Tree =
        {
          q: "In a binary search tree, the value in the left node is:",
          options: [
            "less than its parent",
            "more than its parent",
            "always equal to its parent",
            "unrelated to its parent",
          ],
          answer: 0,
          exp: "The source states that the left-node value is less than its parent.",
        },
        {
          q: "In a binary search tree, the value in the right node is:",
          options: [
            "less than its parent",
            "equal to its parent",
            "more than its parent",
            "always NULL",
          ],
          answer: 2,
          exp: "The source states that the right-node value is more than its parent.",
        },
        // 4) Balanced Tree =
        {
          q: "A balanced tree has left and right subtree heights that are:",
          options: [
            "equal, or differ by no more than 1",
            "always different",
            "unrelated",
            "both zero",
          ],
          answer: 0,
          exp: "The source gives equality or a height difference of at most 1 as the balanced-tree condition.",
        },

        // 5 Types of Binary Tree
        {
          q: "How many types of binary tree are listed in the source?",
          options: ["3", "4", "5", "6"],
          answer: 2,
          exp: "The source heading lists five types of binary tree.",
        },
        // 1- Full/Proper/Strict Binary Tree
        {
          q: "A full, proper, or strict binary tree has nodes with:",
          options: [
            "0 or 2 children",
            "exactly 1 child",
            "0, 1, or 2 children",
            "at most 3 children",
          ],
          answer: 0,
          exp: "The source defines full/proper/strict binary trees as having 0 or 2 children.",
        },
        // 2- Complete Binary Tree
        {
          q: "A complete binary tree has all levels filled completely except the:",
          options: [
            "root level",
            "lowest level",
            "second level",
            "middle level",
          ],
          answer: 1,
          exp: "The source says all levels are completely filled except the lowest level.",
        },
        {
          q: "In the complete-tree illustration, nodes at the last level are filled from:",
          options: [
            "left to right",
            "right to left",
            "the middle outward",
            "random positions",
          ],
          answer: 0,
          exp: "The marked valid complete-tree diagram fills the final level from left to right.",
        },
        // 3- Perfect Binary Tree
        {
          q: "In a perfect binary tree, which levels are completely filled?",
          options: [
            "Only the lowest level",
            "Only the root level",
            "All levels",
            "Only alternate levels",
          ],
          answer: 2,
          exp: "The source defines a perfect binary tree as having all levels completely filled.",
        },
        // 4- Degenerate Binary Tree
        {
          q: "A degenerate binary tree is also called a:",
          options: [
            "complete tree",
            "skewed binary tree",
            "perfect tree",
            "extended tree",
          ],
          answer: 1,
          exp: "The source calls a degenerate binary tree a skewed binary tree.",
        },
        {
          q: "A skewed binary tree may be skewed to the:",
          options: ["left or right", "top only", "bottom only", "root only"],
          answer: 0,
          exp: "The source states that a skewed tree may be left- or right-skewed.",
        },
        // 5- Balanced Binary Tree
        {
          q: "A balanced binary tree permits the heights of its left and right subtrees to differ by at most:",
          options: ["0", "1", "2", "3"],
          answer: 1,
          exp: "The source allows a maximum height difference of 1.",
        },
      ];

      let i = 0,
        score = 0,
        selected = [];

      function loadQ() {
        document.getElementById("qnum").innerText =
          "Question " + (i + 1) + "/" + questions.length;
        document.getElementById("qtext").innerText = questions[i].q;
        let ops = "";
        questions[i].options.forEach((o, idx) => {
          ops += `<div class="opt" onclick="select(${idx})">${o}</div>`;
        });
        document.getElementById("options").innerHTML = ops;
      }

      function select(idx) {
        selected[i] = idx;
        let opts = document.querySelectorAll(".opt");
        opts.forEach((o) => o.classList.remove("selected"));
        opts[idx].classList.add("selected");
      }

      function next() {
        if (i < questions.length - 1) {
          i++;
          loadQ();
        }
      }
      function prev() {
        if (i > 0) {
          i--;
          loadQ();
        }
      }

      function submitQuiz() {
        score = 0;
        let res = "";
        questions.forEach((q, idx) => {
          if (selected[idx] == q.answer) {
            score++;
            res += `<p>Q${idx + 1}: Correct</p>`;
          } else {
            res += `<p>Q${idx + 1}: Wrong - ${q.exp}</p>`;
          }
        });
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML =
          "<h3>Score: " + score + "/" + questions.length + "</h3>" + res;
      }

      loadQ();
    </script>
  </body>
</html>
