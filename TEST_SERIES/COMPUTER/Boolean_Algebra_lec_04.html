<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Boolean Algebra (Lec 1)</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #070707;
        --bg2: #120606;
        --card: #111111;
        --card2: #171717;
        --red: #e50914;
        --red2: #ff2b35;
        --red-dark: #8f050c;
        --text: #f5f5f5;
        --muted: #a7a7a7;
        --border: #2a2a2a;
        --green: #19c37d;
        --green-bg: #082218;
        --wrong: #ff4d5a;
        --wrong-bg: #26090c;
      }

      body {
        font-family: Arial, sans-serif;
        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(229, 9, 20, 0.2),
            transparent 38%
          ),
          linear-gradient(145deg, var(--bg), var(--bg2) 55%, #080808);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      .container {
        max-width: 800px;
        margin: auto;
        padding: 16px 12px;
      }

      .card {
        background: linear-gradient(
          145deg,
          rgba(24, 24, 24, 0.98),
          rgba(12, 12, 12, 0.98)
        );
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: 14px;
        margin-top: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      #qnum {
        display: inline-block;
        color: #fff;
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: 0 5px 15px rgba(229, 9, 20, 0.22);
      }

      .qtext {
        font-size: 17px;
        line-height: 1.55;
        font-weight: 600;
        margin: 15px 0;
        color: #fff;
      }

      .opt {
        padding: 13px 14px;
        border: 1px solid #303030;
        background: #151515;
        color: #ddd;
        border-radius: 10px;
        margin: 8px 0;
        cursor: pointer;
        transition: all 0.18s ease;
        line-height: 1.4;
      }

      .opt:hover {
        border-color: var(--red);
        background: #1d0b0c;
        transform: translateY(-1px);
      }

      .opt.selected {
        border-color: var(--red2);
        background: linear-gradient(
          90deg,
          rgba(229, 9, 20, 0.2),
          rgba(229, 9, 20, 0.07)
        );
        color: #fff;
        box-shadow: inset 3px 0 0 var(--red);
      }

      .opt.correct {
        background: var(--green-bg);
        border-color: var(--green);
        color: #dfffee;
      }

      .opt.wrong {
        background: var(--wrong-bg);
        border-color: var(--wrong);
        color: #ffe2e5;
      }

      button {
        padding: 10px 16px;
        margin: 5px 3px;
        border: 1px solid #3a3a3a;
        border-radius: 9px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.18s ease;
      }

      button:hover {
        border-color: var(--red);
        background: #26090b;
        transform: translateY(-1px);
      }

      button:last-child {
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        border-color: var(--red);
        box-shadow: 0 6px 18px rgba(229, 9, 20, 0.22);
      }

      button:last-child:hover {
        background: linear-gradient(135deg, var(--red2), var(--red));
        box-shadow: 0 8px 22px rgba(229, 9, 20, 0.32);
      }

      #result {
        display: none;
        border-color: rgba(229, 9, 20, 0.45);
        background: linear-gradient(145deg, #171010, #101010);
      }

      #result h3 {
        color: #fff;
        margin-top: 0;
        padding-bottom: 10px;
        border-bottom: 1px solid #302020;
      }

      #result p {
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 7px;
        background: #151515;
        color: #ccc;
        font-size: 14px;
        line-height: 1.45;
      }

      @media (max-width: 520px) {
        .container {
          padding: 10px 9px;
        }

        .card {
          padding: 13px;
          border-radius: 12px;
          margin-top: 10px;
        }

        .qtext {
          font-size: 16px;
        }

        .opt {
          padding: 12px;
          font-size: 14px;
        }

        button {
          padding: 10px 13px;
          margin: 4px 2px;
        }
      }
    </style>
      <link rel="stylesheet" href="../../css/style.css" data-mn-theme />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div id="qnum"></div>
        <div id="qtext" class="qtext"></div>
        <div id="options"></div>
      </div>

      <div class="card">
        <button onclick="prev()">Prev</button>
        <button onclick="next()">Next</button>
        <button onclick="submitQuiz()">Submit</button>
      </div>

      <div id="result" class="card"></div>
    </div>

    <script>
      const questions = [
        // Boolean Algebra lec 04
        // questions
        // Convert SOP → Minterm/Maxterm

        {
          q: "Q.1. Convert SOP expression to Min Term & Max Term? Y= A’B’C’ + A’BC’ + A’BC + AB’C + ABC.?",
          options: [
            "Minterm = 1,2,4,6,7 Maxterm = 0,3,5",
            "Minterm = 0,1,3,6,7 Maxterm = 2,4,5",
            "Minterm = 1,3,5,6,7 Maxterm = 0,2,4",
            "Minterm = 0,2,3,5,7 Maxterm = 1,4,6",
            "None of these",
          ],
          answer: 3,
          exp: "The terms correspond to 000, 010, 011, 101 and 111, giving Minterm = Σm(0,2,3,5,7) and Maxterm = πM(1,4,6).",
        },

        // Convert SOP → Minterm/Maxterm

        {
          q: "Q.2. Convert SOP expression to Min Term & Max Term? = A’BC + AB’C’ + AB’C + ABC’ +ABC",
          options: [
            "Minterm = 1,2,4,6,7 Maxterm = 0,3,5",
            "Minterm = 0,1,3,6,7 Maxterm = 2,4,5",
            "Minterm = 1,3,5,6,7 Maxterm = 0,2,4",
            "Minterm = 3,4,5,6,7 Maxterm = 0,1,2",
            "None of these",
          ],
          answer: 3,
          exp: "The terms correspond to 011, 100, 101, 110 and 111, giving Minterm = Σm(3,4,5,6,7) and Maxterm = πM(0,1,2).",
        },

        // Convert SOP → Minterm/Maxterm

        {
          q: "Q.3. Convert SOP expression to Min Term & Max Term? F= A’B’C + AB’C’ + ABC’.?",
          options: [
            "Minterm = 0,2,4 Maxterm = 1,3,5,6,7",
            "Minterm = 1,4,6 Maxterm = 0,2,3,5,7",
            "Minterm = 1,5,7 Maxterm = 0,2,3,4,6",
            "Minterm = 0,1,6 Maxterm = 2,3,4,5,7",
            "None of these",
          ],
          answer: 1,
          exp: "The terms correspond to 001, 100 and 110, giving Minterm = Σm(1,4,6) and Maxterm = πM(0,2,3,5,7).",
        },
        // Convert SOP → Minterm/Maxterm

        {
          q: "Q.4. In ____ form number of variables depends on the output of SOP or POS.?",
          options: [
            "Standard Form",
            "Normal Form",
            "Algebra Form",
            "Canonical Form",
            "None of these",
          ],
          answer: 3,
          exp: "In canonical form, the number of variables depends on the output of SOP or POS.",
        },

        {
          q: "Q.5. Canonical form of Boolean expression is mainly based on.?",
          options: ["SOP", "POS", "Both of these", "None of these", "SOS"],
          answer: 2,
          exp: "Canonical form is mainly based on SOP and POS.",
        },

        {
          q: "Q.6. The expression Y=AB+BC+AC shows the _________ operation.?",
          options: ["EX-OR", "SOP", "POS", "NOR", "None of these"],
          answer: 1,
          exp: "The expression is in Sum of Product form.",
        },

        {
          q: "Q.7. The expression Y=(A+B)(B+C)(C+A) shows the _________ operation.?",
          options: ["AND", "POS", "SOP", "NAND", "SOS"],
          answer: 1,
          exp: "The expression is in Product of Sum form.",
        },

        {
          q: "Q.8. The terms in SOP are called ____?",
          options: [
            "Max Terms",
            "Min terms",
            "Mid Terms",
            "Sum Terms",
            "All of these",
          ],
          answer: 1,
          exp: "The terms in SOP are called min terms.",
        },

        {
          q: "Q.9. The terms in POS are called ____?",
          options: [
            "Max Terms",
            "Min terms",
            "Mid Terms",
            "Sum Terms",
            "None of these",
          ],
          answer: 0,
          exp: "The terms in POS are called max terms.",
        },

        {
          q: "Q.10. _______ is a function for which the number of minterms and number of maxterms are same.?",
          options: [
            "Boolean",
            "Universal",
            "Self dual",
            "Neutral",
            "None of these",
          ],
          answer: 3,
          exp: "The function described is called a Neutral function.",
        },

        {
          q: "In the SOP expression A.B + A.B̅.C + A.B̅, how many variables are present?",
          options: ["2", "3", "4", "5"],
          answer: 1,
          exp: "The variables appearing in the expression are A, B and C.",
        },

        {
          q: "In the SOP expression A.B + A.B̅.C + A.B̅, how many literals are present?",
          options: ["5", "6", "7", "8"],
          answer: 2,
          exp: "The three product terms contain 2, 3 and 2 literals respectively, giving 7 literals.",
        },

        {
          q: "In the SOP expression A.B + A.B̅.C + A.B̅, how many terms are present?",
          options: ["2", "3", "4", "5"],
          answer: 1,
          exp: "There are three product groups, so the expression contains 3 terms.",
        },

        // Boolean Algebra

        {
          q: "Q.11. In Boolean algebra, the word literal means.?",
          options: [
            "product term",
            "all the variables in a Boolean expression",
            "inverse function",
            "variable or its complement",
            "All of these",
          ],
          answer: 3,
          exp: "A literal means a variable or its complement.",
        },
        // Convert SOP → POS

        {
          q: "Q.1. Convert SOP expression to POS expression? Y(SOP)= A’B’C’ + A’BC’ + A’BC + AB’C + ABC.?",
          options: [
            "(A’+B’+C’) (A’+B+C’) (A+B+C)",
            "(A+B+C) (A’+B’+C’) (A’+B’+C)",
            "(A’+B+C’) (A’+B’+C) (A+B’+C’)",
            "(A+B+C’) (A’+B+C) (A’+B’+C)",
            "None of these",
          ],
          answer: 3,
          exp: "The equivalent POS expression is (A+B+C’) (A’+B+C) (A’+B’+C).",
        },
        {
          q: "Q.2. Convert SOP expression to POS expression? Y(SOP)= X’Y’Z’ + XY’Z’ + XYZ’ + X’YZ’ + XYZ",
          options: [
            "(X+Y+Z’) (X+Y’+Z’) (X’+Y+Z’)",
            "(X’+Y’+Z’) (X+Y’+Z’) (X’+Y+Z’)",
            "(X+Y+Z’) (X’+Y’+Z’) (X’+Y’+Z’)",
            "(X+Y+Z) (X+Y’+Z) (X’+Y+Z)",
            "None of these",
          ],
          answer: 0,
          exp: "The equivalent POS expression is (X+Y+Z’) (X+Y’+Z’) (X’+Y+Z’).",
        },
        {
          q: "Q.3. Convert SOP expression to POS expression? Y(SOP)= X’YZ’ + X’YZ + XY’Z + XYZ’",
          options: [
            "(X’+Y’+Z’) (X+Y+Z’) (X’+Y+Z) (X’+Y’+Z’)",
            "(X+Y+Z) (X’+Y’+Z) (X+Y’+Z) (X+Y’+Z’)",
            "(X+Y+Z) (X+Y+Z’) (X’+Y+Z) (X’+Y’+Z’)",
            "(X+Y’+Z’) (X’+Y+Z’) (X’+Y+Z’) (X+Y’+Z)",
            "None of these",
          ],
          answer: 2,
          exp: "The correct POS expression corresponds to maxterms 0, 1, 4 and 7.",
        },
        {
          q: "Q.4. Convert SOP expression to POS expression? Y(SOP)= ABC+AB'C' + AB'C+ABC'+A'B'C",
          options: [
            "(A'+B'+C')(A'+B+C')(A'+B+C)",
            "(A'+B'+C')(A+B'+C)(A+B'+C)",
            "(A+B+C)(A'+B+C')(A+B'+C)",
            "(A+B+C)(A+B'+C)(A+B'+C')",
            "None of these",
          ],
          answer: 3,
          exp: "The equivalent POS expression is (A+B+C)(A+B'+C)(A+B'+C').",
        },

        // questions
      ];

      let i = 0,
        score = 0,
        selected = [];

      function loadQ() {
        document.getElementById("qnum").innerText =
          "Question " + (i + 1) + "/" + questions.length;
        document.getElementById("qtext").innerText = questions[i].q;
        let ops = "";
        questions[i].options.forEach((o, idx) => {
          ops += `<div class="opt" onclick="select(${idx})">${o}</div>`;
        });
        document.getElementById("options").innerHTML = ops;
      }

      function select(idx) {
        selected[i] = idx;
        let opts = document.querySelectorAll(".opt");
        opts.forEach((o) => o.classList.remove("selected"));
        opts[idx].classList.add("selected");
      }

      function next() {
        if (i < questions.length - 1) {
          i++;
          loadQ();
        }
      }
      function prev() {
        if (i > 0) {
          i--;
          loadQ();
        }
      }

      function submitQuiz() {
        score = 0;
        let res = "";
        questions.forEach((q, idx) => {
          if (selected[idx] == q.answer) {
            score++;
            res += `<p>Q${idx + 1}: Correct</p>`;
          } else {
            res += `<p>Q${idx + 1}: Wrong - ${q.exp}</p>`;
          }
        });
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML =
          "<h3>Score: " + score + "/" + questions.length + "</h3>" + res;
      }

      loadQ();
    </script>
  </body>
</html>
