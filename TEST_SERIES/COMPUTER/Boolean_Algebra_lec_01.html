      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #070707;

        --card: #111111;

        --red: #e50914;
        --red2: #ff2b35;
        --red-dark: #8f050c;

        --muted: #a7a7a7;
        --border: #2a2a2a;
        --green: #19c37d;
        --green-bg: #082218;
        --wrong: #ff4d5a;
        --wrong-bg: #26090c;
      }

        background:

        color: var(--text);
        margin: 0;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      .container {
        max-width: 800px;
        margin: auto;
        padding: 16px 12px;
      }

      .card {
        background: linear-gradient(145deg, rgba(24,24,24,.98), rgba(12,12,12,.98));
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: 14px;
        margin-top: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
      }

      #qnum {
        display: inline-block;
        color: #fff;
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .3px;
        box-shadow: 0 5px 15px rgba(229,9,20,.22);
      }

      .qtext {
        font-size: 17px;
        line-height: 1.55;
        font-weight: 600;
        margin: 15px 0;
        color: #fff;
      }

      .opt {
        padding: 13px 14px;
        border: 1px solid #303030;
        background: #151515;
        color: #ddd;
        border-radius: 10px;
        margin: 8px 0;
        cursor: pointer;
        transition: all .18s ease;
        line-height: 1.4;
      }

      .opt:hover {
        border-color: var(--red);
        background: #1d0b0c;
        transform: translateY(-1px);
      }

      .opt.selected {
        border-color: var(--red2);
        background: linear-gradient(90deg, rgba(229,9,20,.20), rgba(229,9,20,.07));
        color: #fff;
        box-shadow: inset 3px 0 0 var(--red);
      }

      .opt.correct {
        background: var(--green-bg);
        border-color: var(--green);
        color: #dfffee;
      }

      .opt.wrong {
        background: var(--wrong-bg);
        border-color: var(--wrong);
        color: #ffe2e5;
      }

      button {
        padding: 10px 16px;
        margin: 5px 3px;
        border: 1px solid #3a3a3a;
        border-radius: 9px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        transition: all .18s ease;
      }

      button:hover {
        border-color: var(--red);
        background: #26090b;
        transform: translateY(-1px);
      }

      button:last-child {
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        border-color: var(--red);
        box-shadow: 0 6px 18px rgba(229,9,20,.22);
      }

      button:last-child:hover {
        background: linear-gradient(135deg, var(--red2), var(--red));
        box-shadow: 0 8px 22px rgba(229,9,20,.32);
      }

      #result {
        display: none;
        border-color: rgba(229,9,20,.45);
        background: linear-gradient(145deg, #171010, #101010);
      }

      #result h3 {
        color: #fff;
        margin-top: 0;
        padding-bottom: 10px;
        border-bottom: 1px solid #302020;
      }

      #result p {
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 7px;
        background: #151515;
        color: #ccc;
        font-size: 14px;
        line-height: 1.45;
      }

      @media (max-width: 520px) {
        .container {
          padding: 10px 9px;
        }

        .card {
          padding: 13px;
          border-radius: 12px;
          margin-top: 10px;
        }

        .qtext {
          font-size: 16px;
        }

        .opt {
          padding: 12px;
          font-size: 14px;
        }

        button {
          padding: 10px 13px;
          margin: 4px 2px;
        }

          q: "XNOR gates are particularly useful in digital systems for:",
          options: [
            "Data synchronization and data multiplexing",
            "Only voltage amplification",
            "Only signal generation",
            "Power conversion",
          ],
          answer: 0,
          exp: "The given concept identifies data synchronization and data multiplexing as applications of XNOR.",
        },
        // questions
      ];

      let i = 0,
        score = 0,
        selected = [];

      function loadQ() {
        document.getElementById("qnum").innerText =
          "Question " + (i + 1) + "/" + questions.length;
        document.getElementById("qtext").innerText = questions[i].q;
        let ops = "";
        questions[i].options.forEach((o, idx) => {
          ops += `<div class="opt" onclick="select(${idx})">${o}</div>`;
        });
        document.getElementById("options").innerHTML = ops;
      }

      function select(idx) {
        selected[i] = idx;
        let opts = document.querySelectorAll(".opt");
        opts.forEach((o) => o.classList.remove("selected"));
        opts[idx].classList.add("selected");
      }

      function next() {
        if (i < questions.length - 1) {
          i++;
          loadQ();
        }
      }
      function prev() {
        if (i > 0) {
          i--;
          loadQ();
        }
      }

      function submitQuiz() {
        score = 0;
        let res = "";
        questions.forEach((q, idx) => {
          if (selected[idx] == q.answer) {
            score++;
            res += `<p>Q${idx + 1}: Correct</p>`;
          } else {
            res += `<p>Q${idx + 1}: Wrong - ${q.exp}</p>`;
          }
        });
        document.getElementById("result").style.display = "block";
        document.getElementById("result").innerHTML =
          "<h3>Score: " + score + "/" + questions.length + "</h3>" + res;
      }

      loadQ();
    </script>
  </body>
</html>
